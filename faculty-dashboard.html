<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UCVM · Faculty Dashboard</title>
  <link rel="stylesheet" href="faculty-access.css">
</head>
<body>
  <header>
    <div><h1>Faculty Dashboard</h1><span id="identity">Checking sign-in…</span></div>
    <nav>
      <a href="index.html">My Teaching Day</a>
      <a href="faculty-dashboard.html">Faculty Dashboard</a>
      <a href="user-management.html" id="management-link" hidden>User Management</a>
      <a href="faculty-admin.html" id="directory-link" hidden>Faculty Directory</a>
      <a href="password.html">Change password</a>
      <button id="signout">Sign out</button>
    </nav>
  </header>
  <main>
    <p id="status" role="status"></p>
    <div id="content" hidden>
      <nav class="panel">
        <button id="list-tab" class="primary">My teaching list</button>
        <button id="history-tab">Change history</button>
        <button id="afc-tab">AFC requests</button>
      </nav>
      <section id="sessions-panel" class="panel">
        <div class="dashboard-heading">
          <div><h2>My teaching sessions</h2><p id="session-note"></p></div>
          <strong id="session-count"></strong>
        </div>
        <p id="match-note" class="match-note"></p>
        <div id="list-view">
          <div class="table-scroll">
            <table>
              <thead><tr><th>Date / time</th><th>Course / session</th><th>Faculty</th><th>Assignment</th></tr></thead>
              <tbody id="sessions-body"></tbody>
            </table>
          </div>
        </div>
      </section>
      <section id="history-panel" class="panel" hidden></section>
      <section id="afc-panel" class="panel" hidden><p class="afc-loading">Open AFC requests to load the workflow.</p></section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="session-guard.js"></script>
  <script src="faculty-access.js"></script>
  <script src="asset-loader.js"></script>
  <script src="signature-capture.js"></script>
  <script src="afc-actions.js"></script>
  <script src="faculty-dashboard.js"></script>
  <script src="afc-workflow.js"></script>
</body>
</html>
