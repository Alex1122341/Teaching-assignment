name: WS5B Firestore Deploy

on:
  push:
    branches:
      - maintenance/ws5b-firestore-deploy
    paths:
      - "ops/ws5b-firestore-deploy.trigger"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact approved main commit
        uses: actions/checkout@v4
        with:
          ref: 054e4a427d63793f9c21df754711869a4299761e

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_TESTER_TEACHING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESTER_TEACHING }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_TESTER_TEACHING:-}"
          cred_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_TESTER_TEACHING" > "$cred_file"
          chmod 600 "$cred_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$cred_file" >> "$GITHUB_ENV"

      - name: Deploy reviewed Firestore rules and indexes
        run: npx firebase deploy --project tester-teaching --only firestore:rules,firestore:indexes --non-interactive
