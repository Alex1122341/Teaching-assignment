name: Firebase Lab Set Existing User Password

on:
  workflow_dispatch:
    inputs:
      email:
        description: Existing synthetic account email (locked to adfa@ucalgary.ca)
        required: true
        type: string
      confirmation:
        description: Enter SET-LAB-PASSWORD:adfa@ucalgary.ca:vista-teaching-lab
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-lab-set-existing-password
  cancel-in-progress: false

jobs:
  set_existing_user_password:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: firebase-lab-admin
    env:
      FIREBASE_PROJECT_ID: vista-teaching-lab
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_LAB_SERVICE_ACCOUNT_JSON }}
      LAB_SYNTHETIC_ACCOUNT_PASSWORD: ${{ secrets.LAB_SYNTHETIC_ACCOUNT_PASSWORD }}
      TARGET_EMAIL: ${{ inputs.email }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out selected repository revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Firebase Admin dependency
        run: npm --prefix server ci

      - name: Verify password setter contract
        run: node --test tests/firebase-lab-set-password.test.js

      - name: Require protected lab Admin credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_LAB_SERVICE_ACCOUNT_JSON is not configured in the firebase-lab-admin Environment." >&2
            exit 1
          fi
          if [ -z "$LAB_SYNTHETIC_ACCOUNT_PASSWORD" ]; then
            echo "LAB_SYNTHETIC_ACCOUNT_PASSWORD is not configured in the firebase-lab-admin Environment." >&2
            exit 1
          fi

      - name: Set password on the existing Auth user
        shell: bash
        run: node tools/set-lab-user-password.js --email "$TARGET_EMAIL" --confirmation "$CONFIRMATION"
