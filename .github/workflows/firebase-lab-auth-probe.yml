name: Firebase Lab Auth Probe
# Retry after removing all quota-project overrides

on:
  push:
    branches:
      - probe/firebase-lab-auth-check

permissions:
  contents: read

jobs:
  auth_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: firebase-lab-admin
    env:
      FIREBASE_PROJECT_ID: vista-teaching-lab
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_LAB_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out Firebase Admin v14 fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/firebase-admin-v14-compat

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase Admin dependency
        run: npm --prefix server install --no-audit --no-fund

      - name: Inspect Firebase Admin SDK shape
        run: |
          npm --prefix server ls firebase-admin --depth=0 || true
          node - <<'NODE'
          const path=require('node:path');
          const {createRequire}=require('node:module');
          const req=createRequire(path.resolve('server/package.json'));
          const admin=req('firebase-admin');
          let appKeys=[],authKeys=[],firestoreKeys=[];
          try{appKeys=Object.keys(req('firebase-admin/app')||{}).sort()}catch(error){appKeys=['ERROR:'+error.code]}
          try{authKeys=Object.keys(req('firebase-admin/auth')||{}).sort()}catch(error){authKeys=['ERROR:'+error.code]}
          try{firestoreKeys=Object.keys(req('firebase-admin/firestore')||{}).sort()}catch(error){firestoreKeys=['ERROR:'+error.code]}
          console.log(JSON.stringify({
            exportKeys:Object.keys(admin||{}).sort(),
            hasCredential:Boolean(admin&&admin.credential),
            hasDefault:Boolean(admin&&admin.default),
            defaultExportKeys:admin&&admin.default?Object.keys(admin.default).sort():[],
            appKeys,
            authKeys,
            firestoreKeys
          },null,2));
          NODE

      - name: Verify lab Admin credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_LAB_SERVICE_ACCOUNT_JSON is not configured in the firebase-lab-admin Environment." >&2
            exit 1
          fi

      - name: Probe Firebase project identity and Auth REST
        run: |
          node - <<'NODE'
          (async()=>{
            const path=require('node:path');
            const {createRequire}=require('node:module');
            const req=createRequire(path.resolve('server/package.json'));
            const {cert}=req('firebase-admin/app');
            const raw=process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
            if(!raw)throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON missing');
            const serviceAccount=JSON.parse(raw);
            const token=(await cert(serviceAccount).getAccessToken()).access_token;
            const headers={Authorization:'Bearer '+token};
            const projectRes=await fetch('https://firebase.googleapis.com/v1beta1/projects/vista-teaching-lab',{headers});
            const projectText=await projectRes.text();
            let projectBody={};
            try{projectBody=JSON.parse(projectText)}catch{projectBody={raw:projectText.slice(0,300)}}
            const authRes=await fetch('https://identitytoolkit.googleapis.com/v1/projects/vista-teaching-lab/accounts:batchGet?maxResults=1',{headers});
            const authText=await authRes.text();
            let authBody={};
            try{authBody=JSON.parse(authText)}catch{authBody={raw:authText.slice(0,300)}}
            console.log(JSON.stringify({
              serviceAccountProjectId:serviceAccount.project_id,
              firebaseProject:{
                status:projectRes.status,
                projectId:projectBody.projectId||'',
                projectNumber:projectBody.projectNumber||'',
                displayName:projectBody.displayName||'',
                state:projectBody.state||''
              },
              identityToolkit:{
                status:authRes.status,
                errorStatus:authBody?.error?.status||'',
                errorMessage:String(authBody?.error?.message||'').slice(0,200),
                userCount:Array.isArray(authBody.users)?authBody.users.length:0
              }
            },null,2));
          })().catch(error=>{console.error(error.stack||error.message);process.exit(1)});
          NODE

      - name: Probe Firebase Auth config endpoint read-only
        run: |
          node - <<'NODE'
          (async()=>{
            const path=require('node:path');
            const {createRequire}=require('node:module');
            const req=createRequire(path.resolve('server/package.json'));
            const {cert}=req('firebase-admin/app');
            const serviceAccount=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
            const token=(await cert(serviceAccount).getAccessToken()).access_token;
            const res=await fetch('https://identitytoolkit.googleapis.com/admin/v2/projects/vista-teaching-lab/config',{
              headers:{Authorization:'Bearer '+token}
            });
            const raw=await res.text();
            let body={};try{body=JSON.parse(raw)}catch{body={raw:raw.slice(0,200)}}
            console.log(JSON.stringify({
              status:res.status,
              emailEnabled:body?.signIn?.email?.enabled===true,
              passwordRequired:body?.signIn?.email?.passwordRequired===true,
              authorizedDomains:Array.isArray(body?.authorizedDomains)?body.authorizedDomains:[],
              errorStatus:body?.error?.status||'',
              errorMessage:String(body?.error?.message||'').slice(0,200)
            },null,2));
          })().catch(error=>{console.error(error.stack||error.message);process.exit(1)});
          NODE

      - name: Configure GitHub Pages authorized domain
        run: node tools/configure-lab-auth.js --operation configure --confirmation CONFIGURE-AUTH:vista-teaching-lab

      - name: Probe Firebase Auth and Firestore read-only
        run: |
          node - <<'NODE'
          (async()=>{
            const path=require('node:path');
            const {createRequire}=require('node:module');
            const req=createRequire(path.resolve('server/package.json'));
            const {initializeApp,cert,getApps}=req('firebase-admin/app');
            const {getAuth}=req('firebase-admin/auth');
            const {getFirestore}=req('firebase-admin/firestore');
            const raw=process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
            if(!raw)throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON missing');
            const serviceAccount=JSON.parse(raw);
            if(serviceAccount.project_id!=='vista-teaching-lab')throw new Error('Unexpected Firebase project');
            const app=getApps()[0]||initializeApp({
              projectId:'vista-teaching-lab',
              credential:cert(serviceAccount)
            });
            const auth=getAuth(app);
            const firestore=getFirestore(app);
            let authResult={reachable:false,errorCode:'',errorMessage:''};
            try{
              const users=await auth.listUsers(1);
              authResult={reachable:true,userSampleCount:users.users.length,errorCode:'',errorMessage:''};
            }catch(error){
              authResult={
                reachable:false,
                userSampleCount:0,
                errorCode:String(error?.code||''),
                errorMessage:String(error?.message||'').slice(0,200)
              };
            }
            let firestoreResult={reachable:false,errorCode:'',errorMessage:''};
            try{
              const probe=await firestore.collection('users').limit(1).get();
              firestoreResult={reachable:true,userSampleCount:probe.size,errorCode:'',errorMessage:''};
            }catch(error){
              firestoreResult={
                reachable:false,
                userSampleCount:0,
                errorCode:String(error?.code||''),
                errorMessage:String(error?.message||'').slice(0,200)
              };
            }
            console.log(JSON.stringify({
              projectId:'vista-teaching-lab',
              auth:authResult,
              firestore:firestoreResult
            },null,2));
            if(typeof firestore.terminate==='function')await firestore.terminate();
            if(!firestoreResult.reachable)process.exitCode=2;
          })().catch(error=>{console.error(error.stack||error.message);process.exit(1)});
          NODE
