name: Azure Static Web Apps

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure-production-main
  cancel-in-progress: true

jobs:
  validate_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run static and unit tests
        run: npm test

      - name: Run Firestore and Auth emulator tests
        run: npm run test:emulator

      - name: Prepare production client configuration
        shell: bash
        env:
          PRODUCTION_FIREBASE_WEB_CONFIG_JSON: ${{ vars.PRODUCTION_FIREBASE_WEB_CONFIG_JSON }}
          PRODUCTION_DOE_API_BASE_URL: ${{ vars.PRODUCTION_DOE_API_BASE_URL }}
          EXPECTED_FIREBASE_PROJECT_ID: tester-teaching
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_FIREBASE_WEB_CONFIG_JSON"
          test -n "$PRODUCTION_DOE_API_BASE_URL"
          config_file="$RUNNER_TEMP/firebase-web-config.json"
          printf '%s' "$PRODUCTION_FIREBASE_WEB_CONFIG_JSON" > "$config_file"
          node tools/build-firebase-config.js --from-json "$config_file" --doe-api-base-url "$PRODUCTION_DOE_API_BASE_URL"
          node tools/verify-production-client-config.js
          rm -f "$config_file"

      - name: Build static site
        run: node tools/build-static.js

      - name: Stage Azure configuration
        run: cp staticwebapp.config.json .deploy-static/staticwebapp.config.json

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v7
        with:
          name: azure-production-${{ github.sha }}
          path: .deploy-static
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
