name: Azure Static Web Apps

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azure-production-main
  cancel-in-progress: true

jobs:
  validate_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run static and unit tests
        run: npm test

      - name: Run Firestore and Auth emulator tests
        run: npm run test:emulator

      - name: Install server dependencies
        run: npm --prefix server install --no-audit --no-fund

      - name: Run server tests
        run: npm --prefix server test

      - name: Resolve Managed Functions lockfile
        run: npm --prefix swa-api install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prepare production client configuration
        shell: bash
        env:
          PRODUCTION_DOE_API_BASE_URL: ${{ vars.PRODUCTION_DOE_API_BASE_URL }}
          EXPECTED_FIREBASE_PROJECT_ID: tester-teaching
        run: |
          set -euo pipefail
          args=(--from-json tools/production-firebase-web-config.json --paws-session-backend azure-sql)
          if [[ -n "${PRODUCTION_DOE_API_BASE_URL:-}" ]]; then
            args+=(--doe-api-base-url "$PRODUCTION_DOE_API_BASE_URL")
          fi
          node tools/build-firebase-config.js "${args[@]}"
          node tools/verify-production-client-config.js

      - name: Build static site
        run: node tools/build-static.js

      - name: Stage Azure configuration
        run: cp staticwebapp.config.json .deploy-static/staticwebapp.config.json

      - name: Build Managed Functions source artifact
        run: node tools/build-swa-api.js --output .deploy-swa-api

      - name: Assemble exact Azure production handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .azure-production
          mkdir -p .azure-production/app .azure-production/api
          cp -a .deploy-static/. .azure-production/app/
          cp -a .deploy-swa-api/. .azure-production/api/
          test -f .azure-production/app/index.html
          test -f .azure-production/app/staticwebapp.config.json
          test -f .azure-production/api/index.js
          test -f .azure-production/api/host.json
          test -f .azure-production/api/package.json
          test -f .azure-production/api/package-lock.json

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v7
        with:
          name: azure-production-${{ github.sha }}
          path: .azure-production
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
