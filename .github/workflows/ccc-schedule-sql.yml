name: CCC Schedule SQL Acceptance
on:
  pull_request:
    paths: ['database/azure-sql/**','server/src/ccc/**','server/src/data/sql-ccc-schedule-repository.js','server/test/ccc-schedule-read.test.js','tools/test-ccc-schedule-sql.ps1','.github/workflows/ccc-schedule-sql.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated labeled SQL
        shell: pwsh
        run: |
          $testPassword='Synthetic-'+[guid]::NewGuid().ToString()+'!Aa1'
          Write-Output "::add-mask::$testPassword"
          "PAWS_SQL_TEST_PASSWORD=$testPassword" >> $env:GITHUB_ENV
          docker run --name paws-calendar-ccc-schedule --label paws.calendar-test=1 -p 127.0.0.1:14332:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$testPassword" -d mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          if($LASTEXITCODE -ne 0){throw 'Synthetic SQL start failed.'}
          $ready=$false
          for($attempt=0;$attempt -lt 60;$attempt++){
            docker exec -e "SQLCMDPASSWORD=$testPassword" paws-calendar-ccc-schedule /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' 2>$null | Out-Null
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            Start-Sleep -Seconds 2
          }
          if(-not $ready){throw 'Synthetic SQL readiness failed.'}
      - name: Actual reader / role matrix / permissions / academic year / rollback
        shell: pwsh
        run: ./tools/test-ccc-schedule-sql.ps1 -ContainerName paws-calendar-ccc-schedule
      - name: Stop synthetic SQL
        if: always()
        run: docker rm -f paws-calendar-ccc-schedule
