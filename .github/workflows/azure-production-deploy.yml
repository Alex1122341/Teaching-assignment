name: Azure Production Deploy

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Azure Static Web Apps build run ID from main
        required: true
        type: string
      commit_sha:
        description: Exact main commit SHA produced by that successful build
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: azure-production-manual-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  deploy_production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://red-cliff-04871ca0f.5.azurestaticapps.net
    steps:
      - name: Verify approved source build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$EXPECTED_SHA"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "main"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.status' <<< "$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          test "$(jq -r '.path' <<< "$run_json")" = ".github/workflows/azure-static-web-apps.yml"

      - name: Download approved verified production artifact
        uses: actions/download-artifact@v8
        with:
          name: azure-production-${{ inputs.commit_sha }}
          path: .azure-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify production artifact handoff
        run: |
          set -euo pipefail
          test -f .azure-production/app/index.html
          test -f .azure-production/app/staticwebapp.config.json
          test -f .azure-production/api/index.js
          test -f .azure-production/api/host.json
          test -f .azure-production/api/package.json
          test -f .azure-production/api/package-lock.json

      - name: Deploy approved app and Managed Functions to Azure Static Web Apps
        id: azure-deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: .azure-production/app
          api_location: .azure-production/api
          output_location: ''
          skip_app_build: true
          skip_api_build: false
          production_branch: main

      - name: Verify deployed Azure SQL health
        shell: bash
        run: |
          set -euo pipefail
          health_json="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 "https://red-cliff-04871ca0f.5.azurestaticapps.net/api/health/sql")"
          test "$(jq -r '.ok' <<< "$health_json")" = "true"
          test "$(jq -r '.dependency' <<< "$health_json")" = "azure-sql"

      - name: Publish Azure URL in job summary
        run: |
          echo '### Azure Static Web Apps production deployment' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://red-cliff-04871ca0f.5.azurestaticapps.net' >> "$GITHUB_STEP_SUMMARY"
