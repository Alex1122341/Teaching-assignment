name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require this PR's Change Log entry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          node tools/check-pr-changelog.js --pr "${{ github.event.pull_request.number }}" --base "${{ github.event.pull_request.base.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # The ported PAWS suites live in server/ and need exceljs, jszip, pdf-lib
      # and unzipper. Root `npm ci` does not install them, so without this step
      # every suite that touches a workbook or a PDF fails on a missing module.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run static and unit tests
        run: npm run test:all

      - name: Run Firestore and Auth emulator tests
        run: npm run test:emulator

      - name: Build lightweight deployment
        run: node tools/build-static.js

      - name: Report lightweight metrics
        shell: bash
        run: node tools/report-lightweight.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Browser smoke generated deployment
        run: >-
          npx --no-install firebase emulators:exec --only firestore,auth --project vista-teaching-lab
          "node tools/seed-database.js --emulator && node tools/browser-smoke.js --authenticated && node tools/password-browser-smoke.js"
