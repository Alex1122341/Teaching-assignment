name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run static and unit tests
        run: npm run test:all

      - name: Run Firestore and Auth emulator tests
        run: npm run test:emulator

      - name: Build lightweight deployment
        run: node tools/build-static.js

      - name: Report lightweight metrics
        shell: bash
        run: node tools/report-lightweight.js | tee -a "$GITHUB_STEP_SUMMARY"
